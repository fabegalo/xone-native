name: M0 Build and Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        env:
          XBOXONE_REQUIRE_SYMLINKS: '1'
        run: ctest --test-dir build -C Release --output-on-failure

  appmodel-disposable:
    # Opt-in only: registers an owned fixture package on an ephemeral GitHub VM, never on a user host.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bootstrap and owned component
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target xboxone-systemos appmodel_component --parallel 2
      - name: Report prerequisites
        shell: pwsh
        run: |
          $lua = (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System).EnableLUA
          $dev = (Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense
          "EnableLUA=$lua AllowDevelopmentWithoutDevLicense=$dev OS=$([Environment]::OSVersion.VersionString)"
      - name: Run disposable test with a filtered interactive token
        shell: pwsh
        run: |
          # The runner token is elevated; a Limited scheduled task gets the same interactive user's non-elevated token.
          $out = Join-Path $env:RUNNER_TEMP 'appmodel'
          New-Item -ItemType Directory -Force $out | Out-Null
          $python = (Get-Command python).Source
          $cmd = Join-Path $out 'run.cmd'
          @(
            'set GITHUB_ACTIONS=true', 'set RUNNER_ENVIRONMENT=github-hosted',
            "`"$python`" `"$PWD\tests\appmodel_disposable_test.py`" --disposable --bootstrap `"$PWD\build\Release\xboxone-systemos.exe`" --component `"$PWD\build\Release\appmodel_component.exe`" --evidence `"$out\evidence.json`" > `"$out\stdout.txt`" 2> `"$out\stderr.txt`"",
            "echo %ERRORLEVEL% > `"$out\exit.txt`""
          ) | Set-Content -Encoding ascii $cmd
          $principal = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType Interactive -RunLevel Limited
          $action = New-ScheduledTaskAction -Execute cmd.exe -Argument "/c `"$cmd`"" -WorkingDirectory $out
          Register-ScheduledTask -TaskName xon-appmodel -Action $action -Principal $principal | Out-Null
          Start-ScheduledTask -TaskName xon-appmodel
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path "$out\exit.txt") -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          Get-ScheduledTaskInfo -TaskName xon-appmodel | Format-List LastRunTime, LastTaskResult
          Unregister-ScheduledTask -TaskName xon-appmodel -Confirm:$false
          Get-Content "$out\stderr.txt", "$out\evidence.json" -ErrorAction Continue
          if (-not (Test-Path "$out\exit.txt") -or (Get-Content "$out\exit.txt").Trim() -ne '0') { exit 1 }
