  <title id="title">xone-native — experimental Xbox One compatibility platform</title>
  <desc id="desc">Original abstract illustration of a system chip, native PC execution and separate SystemOS and GameOS paths. Concept art, not an Xbox One dashboard screenshot.</desc>
